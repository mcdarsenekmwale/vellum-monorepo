name: Apply Sync Migration via Management API

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Migration directory name to apply'
        required: true
        default: '8_comprehensive_sync'
        type: string

jobs:
  find-db-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd packages/api && npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Find database and get connection config
        run: |
          cat <<'SCRIPT' > find-db.mjs
          import fs from "node:fs";
          import path from "node:path";

          const API_BASE = "https://api.prisma.io";
          const token = process.env.PRISMA_API_TOKEN;

          async function api(method, apiPath, body = null) {
            const opts = {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(`${API_BASE}${apiPath}`, opts);
            const text = await res.text();
            let data;
            try { data = JSON.parse(text); } catch { data = text; }
            if (!res.ok) {
              console.error(`  API ${method} ${apiPath} failed: ${res.status}`);
              console.error(`  ${JSON.stringify(data, null, 2).slice(0, 500)}`);
              throw new Error(`API ${method} ${apiPath} failed: ${res.status}`);
            }
            return data;
          }

          try {
            // List projects
            console.log("Fetching projects...");
            const projects = await api("GET", "/v1/projects");
            const projectList = projects.data || projects;
            console.log(`Projects: ${projectList.length}`);

            const projectId = process.env.PRISMA_PROJECT_ID || projectList[0]?.id;
            if (!projectId) {
              console.error("No project found");
              process.exit(1);
            }
            console.log(`\nUsing project: ${projectId}`);

            // List databases
            console.log("\nFetching databases...");
            const databasesRes = await api("GET", `/v1/projects/${projectId}/databases`);
            const databases = databasesRes.data || databasesRes;
            console.log(`Databases: ${databases.length}`);
            databases.forEach(d => {
              console.log(` - ${d.id}: ${d.name} (status: ${d.status || d.state || 'unknown'})`);
            });

            if (databases.length === 0) {
              console.error("No databases found");
              process.exit(1);
            }

            // Pick the first database
            const db = databases[0];
            console.log(`\nSelected database: ${db.name} (${db.id})`);

            // Create a new direct connection to get fresh credentials
            console.log("\nCreating new direct connection...");
            const newConn = await api("POST", `/v1/databases/${db.id}/connections`, {
              name: `sync-migration-${Date.now()}`,
              type: "direct",
            });
            const connData = newConn.data || newConn;
            console.log(`  Connection created: ${connData.id || connData.name || 'unknown'}`);
            console.log(`  Keys: ${Object.keys(connData).join(', ')}`);

            // Build connection config from user/pass/host fields
            const connConfig = {
              user: connData.user || '',
              password: connData.pass || connData.password || '',
              host: connData.host || connData.hostname || 'db.prisma.io',
              port: connData.port || 5432,
              database: 'postgres',
              ssl: { rejectUnauthorized: false },
              connectionTimeoutMillis: 30000,
            };

            console.log(`\nConnection config:`);
            console.log(`  host: ${connConfig.host}:${connConfig.port}`);
            console.log(`  user: ${connConfig.user ? connConfig.user.slice(0, 10) + '...' : 'not set'}`);
            console.log(`  password: ${connConfig.password ? 'set (' + connConfig.password.length + ' chars)' : 'not set'}`);
            console.log(`  database: ${connConfig.database}`);

            if (!connConfig.user) {
              console.error("\nNo user found in connection data");
              process.exit(1);
            }

            // Save connection config as JSON
            fs.writeFileSync(
              path.join(process.cwd(), ".db-conn.json"),
              JSON.stringify(connConfig)
            );
            console.log("\nConnection config saved to .db-conn.json");

          } catch (e) {
            console.error("Error:", e.message);
            console.error(e.stack);
            process.exit(1);
          }
          SCRIPT
          node find-db.mjs
        working-directory: packages/api
        env:
          PRISMA_API_TOKEN: ${{ secrets.PRISMA_API_TOKEN }}
          PRISMA_PROJECT_ID: ${{ secrets.PRISMA_PROJECT_ID }}

      - name: Apply sync migration
        run: |
          MIGRATION_NAME="${{ github.event.inputs.migration_name }}"
          MIGRATION_PATH="prisma/migrations/${MIGRATION_NAME}/migration.sql"
          
          if [ ! -f "$MIGRATION_PATH" ]; then
            echo "Migration not found: $MIGRATION_PATH"
            exit 1
          fi
          
          if [ ! -f ".db-conn.json" ]; then
            echo "Connection config file not found"
            exit 1
          fi
          
          echo "Applying migration: $MIGRATION_NAME"
          echo "File size: $(wc -c < "$MIGRATION_PATH") bytes"
          
          cat <<'SCRIPT' > apply-migration.mjs
          import pg from "pg";
          import fs from "node:fs";
          import path from "node:path";
          
          const { Client } = pg;
          const migrationName = process.env.MIGRATION_NAME;
          const migrationPath = path.resolve(process.cwd(), "prisma/migrations", migrationName, "migration.sql");
          
          // Read connection config from JSON file
          let connConfig;
          try {
            connConfig = JSON.parse(fs.readFileSync(".db-conn.json", "utf-8"));
          } catch (e) {
            console.error("Failed to read connection config:", e.message);
            process.exit(1);
          }
          
          console.log(`Connecting to ${connConfig.user.slice(0, 10)}...@${connConfig.host}:${connConfig.port}/${connConfig.database}`);
          
          const client = new Client(connConfig);
          
          try {
            await client.connect();
            console.log("Connected to database");
            
            // Check tables before
            const { rows: beforeTables } = await client.query(
              "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name"
            );
            console.log(`Tables before: ${beforeTables.length}`);
            beforeTables.forEach(t => console.log(` - ${t.table_name}`));
            
            const sql = fs.readFileSync(migrationPath, "utf-8");
            console.log(`\nApplying migration (${sql.length} bytes)...`);
            
            await client.query("BEGIN");
            try {
              await client.query(sql);
              await client.query("COMMIT");
              console.log("Migration applied successfully!");
            } catch (e) {
              await client.query("ROLLBACK");
              throw e;
            }
            
            // Check tables after
            const { rows: tables } = await client.query(
              "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name"
            );
            console.log(`\nTables after: ${tables.length}`);
            
            // Check columns
            const { rows: colRows } = await client.query(
              "SELECT COUNT(*) as count FROM information_schema.columns WHERE table_schema='public'"
            );
            console.log(`Total columns: ${colRows[0].count}`);
            
            // Check indexes
            const { rows: idxRows } = await client.query(
              "SELECT COUNT(*) as count FROM pg_indexes WHERE schemaname = 'public'"
            );
            console.log(`Total indexes: ${idxRows[0].count}`);
            
            // Mark migration in _prisma_migrations
            try {
              const { rows: existing } = await client.query(
                "SELECT id FROM _prisma_migrations WHERE migration_name = $1",
                [migrationName]
              );
              if (existing.length === 0) {
                await client.query(
                  "INSERT INTO _prisma_migrations (id, migration_name, migration_key, finished_at, applied_steps_count) VALUES (gen_random_uuid()::text, $1, $1, now(), 0)",
                  [migrationName]
                );
                console.log(`\nMigration '${migrationName}' marked as applied in _prisma_migrations`);
              } else {
                console.log(`\nMigration '${migrationName}' already recorded in _prisma_migrations`);
              }
            } catch (e) {
              console.log(`\nWarning: Could not mark migration - ${e.message}`);
            }
            
            // Verify User table
            try {
              await client.query('SELECT 1 as test FROM "User" LIMIT 0');
              console.log("\nVerification: User table exists ✓");
            } catch (e) {
              console.log("\nVerification: User table check failed -", e.message);
            }
            
            await client.end();
          } catch (e) {
            console.error("\nMigration failed:", e.message);
            console.error(e.stack);
            process.exit(1);
          }
          SCRIPT
          
          MIGRATION_NAME="$MIGRATION_NAME" node apply-migration.mjs
        working-directory: packages/api
        env:
          MIGRATION_NAME: ${{ github.event.inputs.migration_name }}
