name: CD — Backend API

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/api/package.json

      - name: Install dependencies
        run: cd packages/api && npm ci

      - name: Generate Prisma client
        run: cd packages/api && npx prisma generate

      - name: Build application
        run: cd packages/api && npm run build

      - name: Run tests
        run: cd packages/api && npm run test:cov
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/vellum_test' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret' }}

      - name: Build Docker image
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        run: |
          cd packages/api
          docker build -t ${{ secrets.DOCKER_USERNAME }}/vellum-api:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/vellum-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/vellum-api:latest

      - name: Push Docker image
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push ${{ secrets.DOCKER_USERNAME }}/vellum-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/vellum-api:latest
