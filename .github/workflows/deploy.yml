name: Deploy to Vercel

on:
  push:
    branches: [main, api-only]
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Verify build dependencies are in correct package group
        working-directory: packages/api
        run: npm run check:build-deps
      - name: Deploy API to Prisma Compute
        working-directory: packages/api
        env:
          PRISMA_API_TOKEN: ${{ secrets.PRISMA_API_TOKEN }}
          PRISMA_PROJECT_ID: ${{ secrets.PRISMA_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          BCRYPT_ROUNDS: ${{ secrets.BCRYPT_ROUNDS }}
        run: npm run deploy:compute

  deploy-web:
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:packages
      - name: Deploy web-app to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_APP_PROJECT_ID }}
          working-directory: ./apps/web-app
          vercel-args: '--prod'
          vercel-env: |
            NODE_ENV=production
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  deploy-admin:
    runs-on: ubuntu-latest
    needs: [deploy-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:packages
      - name: Deploy admin-dashboard to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: ./apps/admin-dashboard
          vercel-args: '--prod'
          vercel-env: |
            NODE_ENV=production
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}/api

  verify-deployments:
    runs-on: ubuntu-latest
    needs: [deploy-admin]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install requests
        run: pip install requests
      - name: Run API verification tests
        run: python scripts/deploy-verify.py
        env:
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
          ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
          API_ORIGIN: ${{ secrets.VITE_API_BASE_URL }}
