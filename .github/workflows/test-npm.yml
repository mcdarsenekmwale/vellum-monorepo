name: TestNPM

on:
  push:
    branches: [main]

jobs:
  test-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: cd packages/api && npm ci
      - run: cd packages/api && npm run build
