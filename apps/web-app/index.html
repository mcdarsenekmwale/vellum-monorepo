<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("vellum.web.theme");
          var v1Raw = localStorage.getItem("vellum.web.settings.v1");
          var v1 = v1Raw ? JSON.parse(v1Raw) : {};
          var mode = raw || v1.appearance || "system";
          var isDark = false;
          if (mode === "dark") isDark = true;
          else if (mode === "system") isDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var h = document.documentElement;
          if (isDark) h.classList.add("dark"); else h.classList.remove("dark");
          h.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Vellum — Stories, highlights & voices worth reading</title>
    <meta name="description" content="A social reading app for stories, articles and short-form highlights from independent writers and publications." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600;1,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
